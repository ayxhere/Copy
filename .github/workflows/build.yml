name: Build AyX Copy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No setup-android action: v3 tries to install the obsolete "tools"
      # package via sdkmanager, which no longer exists, and fails the job
      # in 9s. ubuntu-24.04 runners already ship ANDROID_HOME, so we only
      # install the exact platform + build-tools we need in the next step.

      - name: Install SDK packages (API 34)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0"

      # NOTE: 'secrets' cannot be used in a step 'if:' — GitHub rejects the
      # whole workflow before any job starts. So this step always runs and
      # decides inside the script: secret missing = unsigned build, no failure.
      - name: Restore signing keystore from secret (if set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "No signing secret set — building unsigned release + debug."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > ayx-copy.p12
          {
            echo "AYX_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "AYX_KEY_ALIAS=$KEY_ALIAS"
            echo "AYX_KEY_PASSWORD=$KEY_PASSWORD"
          } >> gradle.properties

      - name: Build APKs
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.10.2
          arguments: assembleDebug assembleRelease --stacktrace --no-daemon

      - name: List outputs
        run: |
          ls -l app/build/outputs/apk/debug/ app/build/outputs/apk/release/ || true
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "== $apk"; "$APKSIGNER" verify --print-certs "$apk" 2>&1 | head -n 5 || true
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AyXCopy-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AyXCopy-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
