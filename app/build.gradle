apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.kapt'

android {
    namespace 'ayx.copy'
    compileSdk 34

    defaultConfig {
        applicationId "ayx.copy"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "5.0"
    }

    // Release signing is SECRET-DRIVEN, never committed:
    // CI decodes ANDROID_KEYSTORE_BASE64 to ayx-copy.p12 and passes
    // AYX_STORE_PASSWORD / AYX_KEY_ALIAS / AYX_KEY_PASSWORD as Gradle
    // properties. Without them, release builds unsigned (debug still works).
    signingConfigs {
        release {
            def storeObj = rootProject.file("ayx-copy.p12")
            if (storeObj.exists() && project.hasProperty("AYX_STORE_PASSWORD")) {
                storeFile storeObj
                storePassword project.property("AYX_STORE_PASSWORD")
                keyAlias project.findProperty("AYX_KEY_ALIAS") ?: "ayx"
                keyPassword project.property("AYX_KEY_PASSWORD")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.file("ayx-copy.p12").exists() && project.hasProperty("AYX_STORE_PASSWORD")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        // Fix kapt with Kotlin 2.1 — explicitly set language version
        freeCompilerArgs += ["-Xjvm-default=all"]
    }

    kapt {
        // Required for Kotlin 2.x + kapt compatibility
        useBuildCache = false
        arguments {
            arg("room.schemaLocation", "$projectDir/schemas")
            arg("room.incremental", "false")
        }
        javacOptions {
            option("-source", "17")
            option("-target", "17")
        }
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.0'

    // Material 3
    implementation 'com.google.android.material:material:1.11.0'

    // ConstraintLayout
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Room — using kapt (no KSP needed)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Lifecycle / Coroutines
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Lottie
    implementation 'com.airbnb.android:lottie:6.3.0'

    // NOTE: No biometric library — using android.hardware.biometrics.BiometricPrompt
    // which is built into Android API 28+ (our minSdk is 26, handled with version check)
}
